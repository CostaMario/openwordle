<!DOCTYPE html>
<html>

<head>
    <title>Openwordle</title>
</head>

<body>
    <header>
        <button>Sitelink</button>
    </header>
    <div>
        <form action="javascript:startGame()" class="mainmenu">
            <label>OPENWORDLE</label>
            <div>
                <div>
                    <label>Word length</label>
                    <input class="wordlength" type="number" min="3" max="10" value="5" />
                </div>
                <div>
                    <label>Attempts</label>
                    <input class="attempts" type="number" min="1" max="10" value="6" />
                </div>
            </div>
            <div>
                <label></label>
                <select id="words" value="0" class="difficulty">
                    <option value="0">250 most common</option>
                    <option value="1">1000 most common</option>
                    <option value="2">2500 most common</option>
                    <option value="3">All available words</option>
                </select>
            </div>
            <input type="submit" value="PLAY" />
        </form>
        <form action="javascript:guess()" class="game" style="visibility:hidden">
            <div class="endscreen">
                <div>YOU WIN</div>
                <div>The word was </div>
            </div>
            <div class="board" style="width:500px">
            </div>
            <div class="regularbuttons">
                <input type="submit" value="GUESS" />
                <button onclick="backspace();" type="button">ERASE</button>
            </div>
            <div class="endbuttons">
                <button onclick="startGame();" type="button">RETRY</button>
                <button onclick="returnToMenu();" type="button">BACK</button>
            </div>
        </form>
    </div>
    <script src="game.js"></script>
</body>

</html>
